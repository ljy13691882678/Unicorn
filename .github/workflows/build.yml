# 云端 CI：自动编译电脑端 EXE 与手机端 APK，并在打版本 tag 时发布 GitHub Release
# 触发：push 到 main、推送 tag v*、或手动 (workflow_dispatch)
name: Build EXE + APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:      # 仓库 Actions 页面可手动点“Run workflow”

permissions:
  contents: write

jobs:
  build-desktop:
    name: 电脑端 Windows EXE
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 CMake（首次会联网拉取 Dear ImGui + GLFW）
        run: cmake -S imgui_app/desktop -B imgui_app/desktop/build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build imgui_app/desktop/build --config Release --parallel

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-exe
          path: |
            imgui_app/desktop/build/Release/desktop.exe
          if-no-files-found: error

  build-android:
    name: 手机端 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（AGP 8 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 初始化 Android SDK（命令行工具 + 接受许可）
        uses: android-actions/setup-android@v3

      - name: 安装 平台/构建工具/CMake/NDK
        run: |
          sdkmanager --install "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653" \
            | tr '\r' '\n' | tail -2

      - name: 编译 Debug APK（可安装）
        run: |
          cd imgui_app/android
          ./gradlew --no-daemon assembleDebug

      - name: 编译签名 Release APK（稳定版）
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd imgui_app/android
          ./gradlew --no-daemon assembleRelease

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            imgui_app/android/app/build/outputs/apk/debug/app-debug.apk
            imgui_app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish-release:
    name: 发布 GitHub Release（仅打版本 tag 时）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-desktop, build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 EXE 产物
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-exe
          path: release-assets/

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: 创建/更新 GitHub Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}  （稳定版）
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**